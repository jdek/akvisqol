[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "akvisqol"
dynamic = ["version"]
description = "Fast ViSQOL (Zig, optional Metal/CUDA): drop-in for google/visqol's and visqol-python's Python APIs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSES/*"]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "protobuf>=3.20"]

# visqol-python's command line.
[project.scripts]
visqol = "visqol.__main__:main"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.hatch.version]
path = "build.zig"
pattern = 'const version = "(?P<version>[^"]+)";'

[tool.hatch.build.targets.wheel]
packages = ["src/python/visqol"]

[tool.hatch.build.targets.wheel.force-include]
"src/model/libsvm_nu_svr_model.txt" = "visqol/model/libsvm_nu_svr_model.txt"
"src/model/lattice_tcditugenmeetpackhref_ls2_nl60_lr12_bs2048_learn.005_ep2400_train1_7_raw.tflite" = "visqol/model/lattice_tcditugenmeetpackhref_ls2_nl60_lr12_bs2048_learn.005_ep2400_train1_7_raw.tflite"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "src/python/hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["build.zig", "build.zig.zon", "src", "zimt", "README.md", "LICENSES", "REUSE.toml"]

[tool.pytest.ini_options]
testpaths = ["src/python/tests"]
