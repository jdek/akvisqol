name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: 0.17.0

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # GitHub's macOS VMs have no usable Metal device; Metal is tested locally.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/cache@v4
        with:
          path: tests/data
          key: testdata-${{ hashFiles('tests/fetch_data.sh') }}
      - run: tests/fetch_data.sh
      - run: zig build test -Doptimize=ReleaseSafe -Dmetal=false

  # The GPU backend CI can run: Vulkan on lavapipe, under validation.
  vulkan:
    name: vulkan (lavapipe)
    runs-on: ubuntu-latest
    env:
      ZIMT_VULKAN_DEVICE: llvmpipe
      ZIMT_VULKAN_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/cache@v4
        with:
          path: tests/data
          key: testdata-${{ hashFiles('tests/fetch_data.sh') }}
      - run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-validationlayers
      - run: tests/fetch_data.sh
      - run: zig build test -Doptimize=ReleaseSafe -Dvulkan=true
        working-directory: zimt
      - run: zig build test -Doptimize=ReleaseSafe -Dmetal=false -Dvulkan=true
      # Device-local memory with staged copies, as on discrete GPUs without ReBAR.
      - run: zig build test -Doptimize=ReleaseSafe -Dmetal=false -Dvulkan=true
        env:
          ZIMT_VULKAN_NO_HOST_MAP: "1"

  cross:
    name: cross (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-musl
          - riscv64-linux-gnu
          - x86_64-windows-gnu
          - aarch64-windows-gnu
          - x86_64-macos.13.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }}

  wheels:
    name: wheels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Zig cross-compiles every Linux and Windows wheel from one runner.
          - os: ubuntu-latest
            targets: >-
              x86_64-linux-gnu.2.17 aarch64-linux-gnu.2.17
              x86_64-linux-musl aarch64-linux-musl
              x86_64-windows-gnu aarch64-windows-gnu
          # Metal needs a macOS host; -Dmetal=true fails rather than dropping it.
          - os: macos-latest
            targets: aarch64-macos.13.0 x86_64-macos.13.0
            flags: -Dmetal=true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: astral-sh/setup-uv@v6
      - if: runner.os == 'macOS'
        run: xcodebuild -downloadComponent MetalToolchain || true
      - name: sdist
        if: runner.os == 'Linux'
        run: uv build --sdist --out-dir dist
      - name: wheels
        env:
          VISQOL_ZIG_FLAGS: ${{ matrix.flags }}
        run: |
          for t in ${{ matrix.targets }}; do
            VISQOL_TARGET=$t uv build --wheel --out-dir dist
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/

  wheel-test:
    name: wheel-test (${{ matrix.os }})
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            wheel: "*manylinux_2_17_x86_64*.whl"
          - os: ubuntu-24.04-arm
            wheel: "*manylinux_2_17_aarch64*.whl"
          - os: macos-latest
            wheel: "*macosx_13_0_arm64.whl"
          - os: windows-latest
            wheel: "*win_amd64.whl"
    runs-on: ${{ matrix.os }}
    # Windows has not been run outside CI yet.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/cache@v4
        with:
          path: tests/data
          key: testdata-${{ hashFiles('tests/fetch_data.sh') }}
      - run: sh tests/fetch_data.sh
        shell: bash
      - name: pytest
        shell: bash
        env:
          VISQOL_TESTDATA: ${{ github.workspace }}/tests/data
        run: |
          python -m pip install dist/${{ matrix.wheel }} pytest
          python -c "import visqol; print(visqol.__version__, visqol.available_backends())"
          python -m pytest -q -p no:cacheprovider src/python/tests

  wheel-test-musl:
    name: wheel-test (alpine)
    needs: wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: actions/cache@v4
        with:
          path: tests/data
          key: testdata-${{ hashFiles('tests/fetch_data.sh') }}
      - run: tests/fetch_data.sh
      - run: |
          docker run --rm -v "$PWD:/w" -w /w -e VISQOL_TESTDATA=/w/tests/data python:3.13-alpine sh -euc '
            pip install -q dist/*musllinux_1_2_x86_64.whl pytest
            python -m pytest -q -p no:cacheprovider src/python/tests'

  nix:
    name: nix (C++ API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      # visqol-cpp runs its ctest suite.
      - run: nix build -L .#akvisqol .#akvisqol-cpp

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: fsfe/reuse-action@v5

  publish:
    # PyPI trusted publishing: register this repo, workflow and the `pypi`
    # environment on the project's PyPI settings first.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, cross, wheel-test, wheel-test-musl, nix, reuse]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
